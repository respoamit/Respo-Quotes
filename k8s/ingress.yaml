apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: respo-quotes
  namespace: quotes-dev
spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 5000

          - path: /
            pathType: Prefix
            backend:
              service:
                name: respo-quotes
                port:
                  number: 80 