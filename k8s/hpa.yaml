apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: respo-quotes
  namespace: quotes-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: respo-quotes

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70