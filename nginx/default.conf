server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location = /robots.txt {
        try_files /robots.txt =404;
    }

    location = /sitemap.xml {
        try_files /sitemap.xml =404;
    }

    location /api/ {
        proxy_pass http://api:5000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}