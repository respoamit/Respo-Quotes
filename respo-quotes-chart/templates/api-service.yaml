apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: {{ .Values.api.service.type }}

  selector:
    app: api

  ports:
    - protocol: TCP
      port: {{ .Values.api.service.port }}
      targetPort: 5000