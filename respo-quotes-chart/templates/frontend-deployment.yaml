apiVersion: apps/v1
kind: Deployment
metadata:
  name: respo-quotes
  namespace: {{ .Release.Namespace }}
spec:
  {{- if not .Values.hpa.enabled }}

  replicas: {{ .Values.frontend.replicaCount }}
  {{- end }}

  selector:
    matchLabels:
      app: respo-quotes

  template:
    metadata:
      labels:
        app: respo-quotes

    spec:
      containers:
        - name: web
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}

          ports:
            - containerPort: 80

          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}

          startupProbe:
            httpGet:
              path: /
              port: 80
            failureThreshold: 30
            periodSeconds: 2

          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3