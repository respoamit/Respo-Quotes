{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: respo-quotes
  namespace: {{ .Release.Namespace }}

  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "respo-quotes-global-ip"
    kubernetes.io/ingress.allow-http: "true"
    networking.gke.io/managed-certificates: respo-quotes-cert

spec:
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 5000

          - path: /
            pathType: Prefix
            backend:
              service:
                name: respo-quotes
                port:
                  number: 80
{{- end }}